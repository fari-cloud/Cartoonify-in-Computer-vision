<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartoonify — Cartoonify in Computer Vision</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎨 Cartoonify</h1>
    <p>Turn any photo into a cartoon — runs entirely in your browser with OpenCV.</p>
    <p class="links">
      <a href="https://github.com/fari-cloud/Cartoonify-in-Computer-vision" target="_blank" rel="noopener">Source code</a>
    </p>
  </header>

  <main>
    <section id="controls">
      <div id="drop-zone">
        <input type="file" id="file-input" accept="image/*" hidden />
        <p id="drop-text">Drop a photo here, or <button id="browse-btn" type="button">browse</button></p>
        <button id="sample-btn" type="button">Try a sample photo</button>
      </div>

      <fieldset id="style-picker">
        <legend>Style</legend>
        <label><input type="radio" name="style" value="classic" checked /> Classic</label>
        <label><input type="radio" name="style" value="sketch" /> Sketch</label>
        <label><input type="radio" name="style" value="comic" /> Comic</label>
        <label><input type="radio" name="style" value="hdr" /> HDR</label>
      </fieldset>
    </section>

    <section id="result-area" hidden>
      <div id="canvases">
        <figure>
          <canvas id="input-canvas"></canvas>
          <figcaption>Original</figcaption>
        </figure>
        <figure>
          <canvas id="output-canvas"></canvas>
          <figcaption>Cartoon</figcaption>
        </figure>
      </div>
      <div id="actions">
        <a id="download-link" download="cartoon.png">Download cartoon</a>
        <span id="status"></span>
      </div>
    </section>

    <p id="error" hidden></p>
    <p id="loading" hidden>Processing…</p>
  </main>

  <footer>
    <p>Built with <a href="https://docs.opencv.org/4.x/d5/d10/tutorial_js_root.html" target="_blank" rel="noopener">OpenCV.js</a>.
      Same pipeline as the <a href="https://github.com/fari-cloud/Cartoonify-in-Computer-vision" target="_blank" rel="noopener">Python package</a>.</p>
  </footer>

  <script async src="https://docs.opencv.org/4.10.0/opencv.js" onload="onOpenCvReady()" onerror="onOpenCvError()"></script>
  <script src="app.js"></script>
</body>
</html>
