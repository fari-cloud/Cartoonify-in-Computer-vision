[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartoonify"
version = "1.0.0"
description = "Turn photos into cartoon-style images with OpenCV"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
mistral = ["mistralai>=1.9,<4"]
dev = ["pytest>=7.0"]

[project.scripts]
cartoonify = "cartoonify.cli:main"

[tool.setuptools]
packages = ["cartoonify"]
